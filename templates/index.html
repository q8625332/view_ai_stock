<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票K线图查询系统</title>
    <!-- Plotly.js CDN -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .input-section {
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-group input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .examples {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .example-tag {
            padding: 8px 15px;
            background: #f0f0f0;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .example-tag:hover {
            background: #667eea;
            color: white;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            display: none;
            padding: 15px;
            background: #fee;
            border-left: 4px solid #f44;
            border-radius: 5px;
            color: #c33;
            margin-bottom: 20px;
        }

        .error.active {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            font-size: 1.2em;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95em;
        }

        .stat-value {
            font-weight: bold;
        }

        .positive {
            color: #4ade80;
        }

        .negative {
            color: #f87171;
        }

        #chart-container {
            margin-top: 30px;
        }

        .cache-info {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .cache-info h4 {
            margin-bottom: 10px;
            color: #667eea;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📈 股票K线图查询系统</h1>
            <p>支持A股、港股实时查询 | 智能缓存 | 交互式图表</p>
        </div>

        <div class="main-card">
            <div class="input-section">
                <h3 style="margin-bottom: 15px;">输入股票代码</h3>
                <div class="input-group">
                    <input 
                        type="text" 
                        id="stockInput" 
                        placeholder="输入股票代码，多个代码用逗号分隔，如：600519,000001,600036"
                        value="600519,000001,600036"
                    >
                    <button class="btn btn-primary" onclick="queryStock()">
                        🔍 查询
                    </button>
                    <button class="btn btn-secondary" onclick="clearCache()">
                        🗑️ 清除缓存
                    </button>
                </div>

                <div class="examples">
                    <span style="color: #666; margin-right: 10px;">快速示例：</span>
                    <div class="example-tag" onclick="setExample('600519')">贵州茅台</div>
                    <div class="example-tag" onclick="setExample('000001')">平安银行</div>
                    <div class="example-tag" onclick="setExample('300750')">宁德时代</div>
                    <div class="example-tag" onclick="setExample('600036')">招商银行</div>
                    <div class="example-tag" onclick="setExample('600519,000001,600036')">多股票对比</div>
                </div>
            </div>

            <div class="error" id="errorMsg"></div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在获取数据，请稍候...</p>
            </div>

            <div id="statsContainer"></div>
            <div id="chart-container" style="width: 100%; min-height: 600px;"></div>

            <div class="cache-info">
                <h4>💡 使用提示</h4>
                <ul style="margin-left: 20px; line-height: 1.8;">
                    <li>支持的代码格式：600519（上海）、000001（深圳）、300750（创业板）、00700（香港）</li>
                    <li>多个股票用逗号分隔，可以对比查看</li>
                    <li>数据会自动缓存24小时，避免频繁请求</li>
                    <li>图表支持缩放、拖动、悬停查看详情等交互操作</li>
                    <li>如果爬取失败，系统会自动使用模拟数据演示</li>
                </ul>
            </div>
        </div>

        <div class="footer">
            <p>股票K线图查询系统 v1.0 | 数据来源：MSN财经</p>
        </div>
    </div>

    <script>
        function setExample(code) {
            document.getElementById('stockInput').value = code;
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = message;
            errorDiv.classList.add('active');
            setTimeout(() => {
                errorDiv.classList.remove('active');
            }, 5000);
        }

        function showLoading(show) {
            const loading = document.getElementById('loading');
            if (show) {
                loading.classList.add('active');
            } else {
                loading.classList.remove('active');
            }
        }

        async function queryStock() {
            const input = document.getElementById('stockInput').value.trim();
            
            if (!input) {
                showError('请输入股票代码');
                return;
            }

            showLoading(true);
            document.getElementById('statsContainer').innerHTML = '';
            document.getElementById('chart-container').innerHTML = '';

            try {
                const response = await fetch('/api/stock', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ codes: input })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || '请求失败');
                }

                // 显示统计信息
                displayStats(data.stats);

                // 显示图表
                const chartContainer = document.getElementById('chart-container');
                
                // 确保Plotly脚本已加载
                console.log('Chart data received:', data.chart_data);
                console.log('Plotly available:', typeof Plotly !== 'undefined');
                
                if (typeof Plotly !== 'undefined' && data.chart_data) {
                    // 使用Plotly直接渲染图表
                    Plotly.newPlot(chartContainer, data.chart_data.data, data.chart_data.layout, {
                        displayModeBar: true,
                        responsive: true
                    });
                    console.log('Chart rendered successfully');
                } else {
                    console.error('Plotly not available or no chart data');
                    chartContainer.innerHTML = '<p style="text-align: center; color: red;">图表加载失败，请检查网络连接</p>';
                }

            } catch (error) {
                showError('查询失败: ' + error.message);
            } finally {
                showLoading(false);
            }
        }

        function displayStats(stats) {
            const container = document.getElementById('statsContainer');
            let html = '<div class="stats-grid">';

            for (const [code, stat] of Object.entries(stats)) {
                const changeClass = stat.change.percent >= 0 ? 'positive' : 'negative';
                const changeSymbol = stat.change.percent >= 0 ? '↑' : '↓';

                html += `
                    <div class="stat-card">
                        <h3>${code}</h3>
                        <div class="stat-item">
                            <span>当前价格:</span>
                            <span class="stat-value">¥${stat.price.current.toFixed(2)}</span>
                        </div>
                        <div class="stat-item">
                            <span>涨跌幅:</span>
                            <span class="stat-value ${changeClass}">
                                ${changeSymbol} ${Math.abs(stat.change.percent).toFixed(2)}%
                            </span>
                        </div>
                        <div class="stat-item">
                            <span>最高价:</span>
                            <span class="stat-value">¥${stat.price.max.toFixed(2)}</span>
                        </div>
                        <div class="stat-item">
                            <span>最低价:</span>
                            <span class="stat-value">¥${stat.price.min.toFixed(2)}</span>
                        </div>
                        <div class="stat-item">
                            <span>数据天数:</span>
                            <span class="stat-value">${stat.total_days}天</span>
                        </div>
                    </div>
                `;
            }

            html += '</div>';
            container.innerHTML = html;
        }

        async function clearCache() {
            if (!confirm('确定要清除所有缓存吗？')) {
                return;
            }

            try {
                const response = await fetch('/api/cache/clear', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({})
                });

                const data = await response.json();

                if (response.ok) {
                    alert(data.message);
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                showError('清除缓存失败: ' + error.message);
            }
        }

        // 回车键查询
        document.getElementById('stockInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                queryStock();
            }
        });
    </script>
</body>
</html>
